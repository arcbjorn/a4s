name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: race tests and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # .go-version is the single source of truth for the toolchain. An
          # exact version here ignores check-latest, so the pin must itself be
          # a patched release.
          go-version-file: .go-version
      - name: go vet
        run: go vet ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: race tests
        run: go test -race ./...
      - name: whitespace
        run: git diff --check

  crossbuild:
    name: linux cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # .go-version is the single source of truth for the toolchain. An
          # exact version here ignores check-latest, so the pin must itself be
          # a patched release.
          go-version-file: .go-version
      - name: build linux amd64
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -o /tmp/a4s ./cmd/a4s
      - name: build linux arm64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: go build -o /tmp/a4s-arm64 ./cmd/a4s
      - name: compile node test binary for linux
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go test -c -o /tmp/a4s-node.test ./node

  simulate:
    name: example simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # .go-version is the single source of truth for the toolchain. An
          # exact version here ignores check-latest, so the pin must itself be
          # a patched release.
          go-version-file: .go-version
      - name: validate example
        run: go run ./cmd/a4s validate --file examples/web-service.json
      - name: simulate example
        run: go run ./cmd/a4s simulate --file examples/web-service.json
      - name: validate spread example
        run: go run ./cmd/a4s validate --file examples/spread-service.json
      - name: simulate spread example
        run: go run ./cmd/a4s simulate --file examples/spread-service.json

  vulnerabilities:
    name: known vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
      # Fails only on a vulnerability the code can actually reach, in the
      # module graph or the standard library of the pinned toolchain.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  docs:
    name: documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: check relative links resolve
        run: ./scripts/check-doc-links.sh
