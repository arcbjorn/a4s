name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.26.3"

jobs:
  test:
    name: race tests and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: go vet
        run: go vet ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: race tests
        run: go test -race ./...
      - name: whitespace
        run: git diff --check

  crossbuild:
    name: linux cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: build linux amd64
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -o /tmp/a4s ./cmd/a4s
      - name: build linux arm64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: go build -o /tmp/a4s-arm64 ./cmd/a4s
      - name: compile node test binary for linux
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go test -c -o /tmp/a4s-node.test ./node

  simulate:
    name: example simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: validate example
        run: go run ./cmd/a4s validate --file examples/web-service.json
      - name: simulate example
        run: go run ./cmd/a4s simulate --file examples/web-service.json

  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      # Short windows on every change; these targets assert invariants rather
      # than only checking for panics, so even a brief run has value. Longer
      # campaigns belong in the scheduled nightly run.
      - name: fuzz approval verification
        run: go test ./control/ -run XXX -fuzz FuzzApprovalVerification -fuzztime 60s
      - name: fuzz scenario validation
        run: go test ./control/ -run XXX -fuzz FuzzScenarioValidation -fuzztime 60s
      - name: fuzz model diagnosis decode
        run: go test ./control/ -run XXX -fuzz FuzzModelDiagnosisDecode -fuzztime 60s
      - name: fuzz projection
        run: go test ./control/ -run XXX -fuzz FuzzProjection -fuzztime 60s
      - name: fuzz event log open
        run: go test ./eventlog/ -run XXX -fuzz FuzzOpen -fuzztime 120s

  docs:
    name: documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: check relative links resolve
        run: ./scripts/check-doc-links.sh
